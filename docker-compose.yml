services:
  tt-worker:
    image: ${TT_WORKER_IMAGE:-ghcr.io/nobody13314/tt-worker:latest}
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      BUSINESS: tt_dz
      TASK_TYPE_ID: ${TASK_TYPE_ID:-38}
      TASK_PLATFORM_URL: ${TASK_PLATFORM_URL}
      TASK_UID: ${TASK_UID:-worker_001_tt}
      TASK_GET_PATH: ${TASK_GET_PATH:-/api/worker/get-task}
      TASK_COMPLETE_PATH: ${TASK_COMPLETE_PATH:-/api/worker/complete-batch}
      DEVICE_API_URL: ${DEVICE_API_URL}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
      DEVICE_POOL_ID: ${DEVICE_POOL_ID:-}
      DEVICE_POOL_GROUP_ID: ${DEVICE_POOL_GROUP_ID:-}
      DEVICE_BATCH_SIZE: ${DEVICE_BATCH_SIZE:-100}
      DEVICE_ALLOW_PARTIAL: ${DEVICE_ALLOW_PARTIAL:-false}
      DEVICE_ORDER: ${DEVICE_ORDER:-oldest}
      SIGNER_URL: ${SIGNER_URL}
      PROXY_GATEWAY_URL: ${PROXY_GATEWAY_URL}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      PROXY_GATEWAY_BUSINESS: ${PROXY_GATEWAY_BUSINESS:-tt_dz}
      PROXY_GATEWAY_WORKER_ID: ${PROXY_GATEWAY_WORKER_ID:-tt-worker}
      PROXY_GATEWAY_ALLOCATE_CONTENT_TYPE: ${PROXY_GATEWAY_ALLOCATE_CONTENT_TYPE:-application/json}
      GROUP_SIZE: ${GROUP_SIZE:-30}
      PROXY_FAILURE_RATIO: ${PROXY_FAILURE_RATIO:-0.8}
      MAX_PROXY_ROTATIONS: ${MAX_PROXY_ROTATIONS:-2}
      CONCURRENCY: ${CONCURRENCY:-30}
      LOG_DETAIL: ${LOG_DETAIL:-all}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
